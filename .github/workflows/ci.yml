name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The NEON paths only compile for aarch64. minifb (an example
      # dev-dependency) builds a little C, hence the cross compiler.
      - name: Clippy for aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo clippy -p rudolf-v --target aarch64-unknown-linux-gnu --all-targets -- -D warnings
      # The CPU library alone: nothing outside src/gpu may need wgpu.
      - name: Check without the gpu feature
        run: cargo check -p rudolf-v --no-default-features --all-targets
      # The GPU tests are #[ignore]d, and the gpu-test job runs them.
      - name: Test
        run: cargo test --workspace

  # Every WGSL kernel against its CPU reference, on Mesa's software Vulkan
  # (lavapipe). GpuDevice falls back to it when there is no hardware adapter.
  gpu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      # The test_ wrappers run each inner_ GPU test in a fresh process.
      - name: GPU tests
        run: cargo test --lib -- --ignored tests::test_
      # GPU tests that are not #[ignore]d: without an adapter they skip.
      - name: GPU tests that skip without an adapter
        run: cargo test --lib "gpu::"
