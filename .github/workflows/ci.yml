name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned, so new clippy lints arrive with a deliberate bump, not a release.
env:
  RUST_VERSION: 1.99.1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # The Python bindings turn on rudolf-v's parallel and serde features,
      # and a workspace build would turn them on for everything; they get
      # steps of their own.
      - name: Clippy
        run: cargo clippy --workspace --exclude rudolf-v-python --all-targets -- -D warnings
      - name: Clippy with parallel and serde
        run: cargo clippy -p rudolf-v --all-targets --features parallel,serde -- -D warnings
      - name: Clippy for the Python bindings
        run: cargo clippy -p rudolf-v-python --all-targets -- -D warnings
      # The CPU library alone: nothing outside src/gpu may need wgpu.
      - name: Clippy without the gpu feature
        run: cargo clippy -p rudolf-v --all-targets --no-default-features -- -D warnings
      # The NEON paths only compile for aarch64. minifb (an example
      # dev-dependency) builds a little C, hence the cross compiler.
      - name: Clippy for aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo clippy -p rudolf-v --target aarch64-unknown-linux-gnu --all-targets -- -D warnings
      # The GPU tests are #[ignore]d, and the gpu-test job runs them.
      - name: Test
        run: cargo test --workspace --exclude rudolf-v-python
      - name: Test the config module and the Python bindings
        run: |
          cargo test -p rudolf-v --features serde --lib config::
          cargo test -p rudolf-v-python

  # Every WGSL kernel against its CPU reference, on Mesa's software Vulkan
  # (lavapipe). GpuDevice falls back to it when there is no hardware adapter.
  gpu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      # The test_ wrappers run each inner_ GPU test in a fresh process.
      - name: GPU tests
        run: cargo test --lib -- --ignored tests::test_
      # GPU tests that are not #[ignore]d: without an adapter they skip.
      - name: GPU tests that skip without an adapter
        run: cargo test --lib "gpu::"
