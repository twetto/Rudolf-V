name: Python wheels

on:
  pull_request:
  push:
    tags:
      - "camera-geometry-v*"
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.package }} ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        package: [camera-geometry, rudolf-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
          working-directory: crates/${{ matrix.package }}-python
      - name: Install wheel
        shell: bash
        working-directory: crates/${{ matrix.package }}-python
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke test
        if: matrix.package == 'camera-geometry'
        working-directory: crates/camera-geometry-python
        run: python tests/smoke.py
      # Without a Vulkan GPU the GPU tests skip.
      - name: Tests
        if: matrix.package == 'rudolf-v'
        working-directory: crates/rudolf-v-python
        run: |
          python -m pip install pytest
          python -m pytest tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.os }}
          path: crates/${{ matrix.package }}-python/dist/*.whl
